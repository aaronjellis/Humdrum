name: release

# Triggers: tag a commit on main with a semver prefix (e.g. v0.3.0).
# The workflow builds, signs, notarizes, staples, Sparkle-signs, and
# publishes a GitHub Release + updates appcast.xml on gh-pages.
#
# One-time setup (see docs/SPARKLE_SETUP.md):
#   • Secrets: APPLE_ID, APPLE_TEAM_ID, APPLE_APP_SPECIFIC_PASSWORD,
#     DEVELOPER_ID_P12_BASE64, DEVELOPER_ID_P12_PASSWORD,
#     SPARKLE_ED_PRIVATE_KEY.
#   • gh-pages branch exists and Pages is enabled pointing at it.
#   • SUFeedURL in Info.plist matches the published Pages URL.

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: macos-15
    permissions:
      contents: write   # gh release create + push to gh-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # build-app.sh reads git history for build number

      - name: Select Xcode (Swift 6+)
        run: |
          # WhisperKit transitively depends on swift-transformers, which
          # in turn pulls swift-jinja 2.x. swift-jinja 2.0+ declares
          # `swift-tools-version: 6.0`, so SPM refuses to resolve under
          # any Swift 5 toolchain (Xcode 15.x). Pick the highest Xcode
          # 16+ installed on the runner; macos-15 ships several. We
          # don't pin a specific 16.x version because the runner image
          # rotates them and pinning forces a workflow edit on every
          # bump — picking max-installed is the lowest-friction option.
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode_17*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "No Xcode 16+ found on runner. Available:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "Selecting: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          swift --version

      - name: Import Developer ID signing cert
        env:
          P12_BASE64:   ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN=build.keychain
          KEYCHAIN_PW=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"

          echo "$P12_BASE64" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          rm /tmp/cert.p12

      - name: Set up notarytool credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID:  ${{ secrets.APPLE_TEAM_ID }}
          APP_PW:   ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool store-credentials humdrum-notary \
            --apple-id "$APPLE_ID" \
            --team-id  "$TEAM_ID" \
            --password "$APP_PW"

      - name: Build + sign + notarize + staple
        env:
          NOTARY_PROFILE: humdrum-notary
        run: ./build-app.sh

      - name: Install Sparkle tools
        run: |
          brew update
          brew install --cask sparkle
          SIGN_UPDATE=$(find /opt/homebrew/Caskroom/sparkle -name sign_update | head -n1)
          if [ -z "$SIGN_UPDATE" ]; then
            echo "Failed to locate sign_update after installing sparkle cask" >&2
            exit 1
          fi
          echo "SIGN_UPDATE=$SIGN_UPDATE" >> "$GITHUB_ENV"

      - name: Sparkle-sign the zip
        env:
          ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          echo "$ED_PRIVATE_KEY" > /tmp/sparkle.key
          SIG_LINE=$("$SIGN_UPDATE" -f /tmp/sparkle.key Humdrum.zip)
          rm /tmp/sparkle.key
          echo "SPARKLE_SIG=$SIG_LINE" >> "$GITHUB_ENV"

      - name: Read version from the bundle
        run: |
          SHORT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
                    Humdrum.app/Contents/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' \
                    Humdrum.app/Contents/Info.plist)
          echo "SHORT_VERSION=$SHORT" >> "$GITHUB_ENV"
          echo "BUILD_VERSION=$BUILD" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `--generate-notes` builds the body from PRs and commits
          # since the previous tag (or from repo start on the first
          # release). No manual changelog upkeep — and the same body
          # gets surfaced on Sparkle's update sheet via the appcast
          # `<description>` we inject below.
          gh release create "$GITHUB_REF_NAME" Humdrum.zip \
            --title "Humdrum $GITHUB_REF_NAME" \
            --generate-notes

      - name: Fetch generated release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pull the body GitHub just generated so the Sparkle update
          # sheet shows the same notes the GH release page shows. We
          # write it to a file rather than an env var because release
          # bodies routinely exceed GITHUB_ENV's per-line size budget.
          gh release view "$GITHUB_REF_NAME" --json body -q .body > /tmp/release_notes.md
          echo "Notes length: $(wc -c < /tmp/release_notes.md) bytes"

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Update appcast.xml
        run: |
          set -euo pipefail
          cd gh-pages
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Humdrum.zip"
          ZIP_SIZE=$(stat -f%z ../Humdrum.zip)
          PUB_DATE=$(date -u +"%a, %d %b %Y %H:%M:%S +0000")

          if [ ! -f appcast.xml ]; then
            cat > appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Humdrum Updates</title>
              <link>https://github.com/${GITHUB_REPOSITORY}</link>
              <description>Latest Humdrum releases.</description>
              <language>en</language>
            </channel>
          </rss>
          EOF
          fi

          # Read the auto-generated release notes; render the markdown
          # to HTML so Sparkle's update sheet displays formatting
          # rather than raw `## headings`. Empty file → empty body,
          # which is fine — Sparkle just shows "no release notes."
          NOTES_HTML=$(python3 - <<'PYRENDER'
          import sys, html, re
          try:
              with open('/tmp/release_notes.md') as f:
                  md = f.read()
          except FileNotFoundError:
              md = ''
          # Minimal markdown → HTML. GitHub auto-notes are simple
          # (## headings + bullet lists + PR links), so we don't need
          # a full markdown parser — keep this dependency-free.
          lines = []
          in_list = False
          for raw in md.splitlines():
              line = raw.rstrip()
              if line.startswith('## '):
                  if in_list:
                      lines.append('</ul>'); in_list = False
                  lines.append(f'<h3>{html.escape(line[3:])}</h3>')
              elif line.startswith('* ') or line.startswith('- '):
                  if not in_list:
                      lines.append('<ul>'); in_list = True
                  text = html.escape(line[2:])
                  # Re-link bare PR URLs that GH inserts.
                  text = re.sub(
                      r'(https?://\S+)',
                      lambda m: f'<a href="{m.group(1)}">{m.group(1)}</a>',
                      text,
                  )
                  lines.append(f'  <li>{text}</li>')
              elif not line:
                  if in_list:
                      lines.append('</ul>'); in_list = False
              else:
                  if in_list:
                      lines.append('</ul>'); in_list = False
                  lines.append(f'<p>{html.escape(line)}</p>')
          if in_list:
              lines.append('</ul>')
          sys.stdout.write('\n'.join(lines))
          PYRENDER
          )
          export NOTES_HTML

          python3 <<PY
          import xml.etree.ElementTree as ET
          import re, os

          ET.register_namespace('sparkle', 'http://www.andymatuschak.org/xml-namespaces/sparkle')
          tree = ET.parse('appcast.xml')
          channel = tree.find('channel')

          item = ET.Element('item')
          ET.SubElement(item, 'title').text = "Version ${SHORT_VERSION}"
          ET.SubElement(item, 'pubDate').text = "${PUB_DATE}"
          ET.SubElement(item, '{http://www.andymatuschak.org/xml-namespaces/sparkle}version').text = "${BUILD_VERSION}"
          ET.SubElement(item, '{http://www.andymatuschak.org/xml-namespaces/sparkle}shortVersionString').text = "${SHORT_VERSION}"

          # <description> drives the body of Sparkle's update sheet.
          # ElementTree doesn't have a native CDATA writer, so we set
          # a sentinel and post-process; without CDATA the HTML tags
          # would be entity-escaped and Sparkle would render the raw
          # tags as text instead of styled output.
          notes_html = os.environ.get('NOTES_HTML', '').strip()
          if notes_html:
              desc = ET.SubElement(item, 'description')
              desc.text = '__CDATA_OPEN__' + notes_html + '__CDATA_CLOSE__'

          sig_line = os.environ['SPARKLE_SIG'].strip()
          attrs = dict(re.findall(r'(\w+(?::\w+)?)="([^"]+)"', sig_line))
          attrs['url'] = "${DOWNLOAD_URL}"
          attrs['length'] = "${ZIP_SIZE}"
          attrs['type'] = 'application/octet-stream'
          ET.SubElement(item, 'enclosure', attrib=attrs)

          channel.insert(0, item)   # newest release first
          tree.write('appcast.xml', encoding='utf-8', xml_declaration=True)

          # Swap the sentinels for real CDATA delimiters. ElementTree
          # entity-escapes everything inside .text, so the sentinel
          # survives serialization as `__CDATA_OPEN__` literal text;
          # we replace post-hoc to land actual `<![CDATA[ ... ]]>`.
          with open('appcast.xml', 'r', encoding='utf-8') as f:
              xml = f.read()
          xml = xml.replace('__CDATA_OPEN__', '<![CDATA[').replace('__CDATA_CLOSE__', ']]>')
          # ET escapes the angle brackets of our HTML inside .text;
          # undo that within the description blocks only.
          xml = re.sub(
              r'(<description>)(.*?)(</description>)',
              lambda m: m.group(1) + (
                  m.group(2)
                  .replace('&lt;', '<')
                  .replace('&gt;', '>')
                  .replace('&amp;', '&')
              ) + m.group(3),
              xml,
              flags=re.DOTALL,
          )
          with open('appcast.xml', 'w', encoding='utf-8') as f:
              f.write(xml)
          PY

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "release: ${GITHUB_REF_NAME}"
          git push origin gh-pages
